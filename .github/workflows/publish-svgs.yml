# Takes the SVG exports that a "Build vector map" run produced and commits them
# into GermanyVectorMap/exports/, so they are browsable — and previewable — straight
# from the repository instead of living only inside a downloadable artifact.
#
# Actions -> Publish SVG exports -> Run workflow -> paste the run id and artifact name.
name: Publish SVG exports

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the Build vector map run to take the SVGs from"
        required: true
        type: string
      artifact:
        description: "Artifact name in that run"
        required: true
        default: report-and-svg-koeln_regbez
        type: string
      copy_svgs:
        description: "Also copy the SVGs into exports/ (off = report only)"
        type: boolean
        default: true
      report_suffix:
        description: "Suffix for the stats file, e.g. -slim (avoids overwriting)"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download the SVG artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming

      - name: Copy the SVGs into exports/
        if: ${{ inputs.copy_svgs }}
        run: |
          mkdir -p GermanyVectorMap/exports
          if [ ! -d incoming/exports ]; then
            echo "::error::artifact '${{ inputs.artifact }}' contains no exports/ directory"
            find incoming -maxdepth 2 | head -20
            exit 1
          fi
          # SVGs only — the stats json and the build log stay out of the repo
          (cd incoming/exports && find . -name '*.svg' -print0 \
            | tar --null -cf - --files-from -) \
            | (cd GermanyVectorMap/exports && tar -xvf -)
          echo "--- exports/ now holds:"
          find GermanyVectorMap/exports -name '*.svg' | sort
          du -sh GermanyVectorMap/exports

      - name: Keep the measurement report
        run: |
          mkdir -p GermanyVectorMap/docs/reports
          for f in incoming/output/*.stats.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .stats.json)
            cp -v "$f" "GermanyVectorMap/docs/reports/${base}${{ inputs.report_suffix }}.stats.json"
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GermanyVectorMap/exports GermanyVectorMap/docs/reports
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "Publish SVG exports from run ${{ inputs.run_id }}

          Generated by scripts/export_svg.py from the vector tiles.
          Map data (c) OpenStreetMap contributors, ODbL 1.0."
          git push origin HEAD:${{ github.ref_name }}
